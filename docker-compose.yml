services:
  postgres:
    image: postgres:16-alpine
    container_name: task-manager
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - tasks_pg_data:/var/lib/postgresql/data

volumes:
  tasks_pg_data:
